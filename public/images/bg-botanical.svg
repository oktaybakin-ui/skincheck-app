<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FDF2F4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FAFAFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3EEF8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>

  <!-- Top-right branch -->
  <g opacity="0.08" transform="translate(420, 30) rotate(15)">
    <path d="M0,0 Q30,-20 60,10 Q90,40 120,20 Q150,0 180,30" fill="none" stroke="#D4627A" stroke-width="2"/>
    <ellipse cx="30" cy="-10" rx="18" ry="10" fill="#D4627A" transform="rotate(-30, 30, -10)"/>
    <ellipse cx="60" cy="15" rx="16" ry="9" fill="#D4627A" transform="rotate(20, 60, 15)"/>
    <ellipse cx="95" cy="25" rx="18" ry="10" fill="#D4627A" transform="rotate(-15, 95, 25)"/>
    <ellipse cx="125" cy="12" rx="15" ry="8" fill="#D4627A" transform="rotate(25, 125, 12)"/>
    <ellipse cx="155" cy="20" rx="17" ry="9" fill="#D4627A" transform="rotate(-20, 155, 20)"/>
  </g>

  <!-- Top-left small leaves -->
  <g opacity="0.06" transform="translate(40, 80) rotate(-10)">
    <path d="M0,0 Q20,30 10,60 Q0,90 20,120" fill="none" stroke="#8B7EC8" stroke-width="1.5"/>
    <ellipse cx="12" cy="25" rx="12" ry="7" fill="#8B7EC8" transform="rotate(40, 12, 25)"/>
    <ellipse cx="8" cy="55" rx="14" ry="8" fill="#8B7EC8" transform="rotate(-35, 8, 55)"/>
    <ellipse cx="15" cy="85" rx="11" ry="6" fill="#8B7EC8" transform="rotate(30, 15, 85)"/>
  </g>

  <!-- Center-right eucalyptus -->
  <g opacity="0.05" transform="translate(480, 250) rotate(5)">
    <path d="M0,0 Q-10,40 5,80 Q20,120 10,160 Q0,200 15,240" fill="none" stroke="#D4627A" stroke-width="1.5"/>
    <ellipse cx="-5" cy="30" rx="16" ry="10" fill="#D4627A" transform="rotate(-25, -5, 30)"/>
    <ellipse cx="8" cy="65" rx="18" ry="11" fill="#D4627A" transform="rotate(20, 8, 65)"/>
    <ellipse cx="15" cy="100" rx="16" ry="10" fill="#D4627A" transform="rotate(-30, 15, 100)"/>
    <ellipse cx="8" cy="135" rx="19" ry="11" fill="#D4627A" transform="rotate(15, 8, 135)"/>
    <ellipse cx="12" cy="175" rx="15" ry="9" fill="#D4627A" transform="rotate(-20, 12, 175)"/>
    <ellipse cx="14" cy="215" rx="17" ry="10" fill="#D4627A" transform="rotate(25, 14, 215)"/>
  </g>

  <!-- Bottom-left large branch -->
  <g opacity="0.07" transform="translate(20, 650) rotate(-5)">
    <path d="M0,0 Q40,-30 80,0 Q120,30 160,10 Q200,-10 240,20 Q280,50 320,30" fill="none" stroke="#D4627A" stroke-width="2"/>
    <ellipse cx="40" cy="-15" rx="20" ry="12" fill="#D4627A" transform="rotate(-25, 40, -15)"/>
    <ellipse cx="80" cy="5" rx="22" ry="13" fill="#D4627A" transform="rotate(30, 80, 5)"/>
    <ellipse cx="120" cy="25" rx="18" ry="11" fill="#D4627A" transform="rotate(-20, 120, 25)"/>
    <ellipse cx="165" cy="8" rx="21" ry="12" fill="#D4627A" transform="rotate(15, 165, 8)"/>
    <ellipse cx="205" cy="-5" rx="19" ry="11" fill="#D4627A" transform="rotate(-30, 205, -5)"/>
    <ellipse cx="245" cy="18" rx="20" ry="12" fill="#D4627A" transform="rotate(25, 245, 18)"/>
  </g>

  <!-- Small scattered circles (flower buds) -->
  <circle cx="520" cy="150" r="4" fill="#D4627A" opacity="0.06"/>
  <circle cx="540" cy="170" r="3" fill="#8B7EC8" opacity="0.05"/>
  <circle cx="80" cy="350" r="5" fill="#D4627A" opacity="0.04"/>
  <circle cx="95" cy="370" r="3" fill="#8B7EC8" opacity="0.04"/>
  <circle cx="450" cy="500" r="4" fill="#D4627A" opacity="0.05"/>
  <circle cx="150" cy="550" r="3" fill="#8B7EC8" opacity="0.04"/>
  <circle cx="350" cy="750" r="4" fill="#D4627A" opacity="0.05"/>
  <circle cx="500" cy="800" r="3" fill="#8B7EC8" opacity="0.04"/>

  <!-- Middle-left lavender sprig -->
  <g opacity="0.06" transform="translate(60, 420) rotate(10)">
    <path d="M0,0 Q5,-30 0,-60 Q-5,-90 5,-120" fill="none" stroke="#8B7EC8" stroke-width="1.5"/>
    <circle cx="0" cy="-30" r="5" fill="#8B7EC8"/>
    <circle cx="-4" cy="-45" r="4" fill="#8B7EC8"/>
    <circle cx="3" cy="-58" r="5" fill="#8B7EC8"/>
    <circle cx="-2" cy="-72" r="4" fill="#8B7EC8"/>
    <circle cx="4" cy="-85" r="4.5" fill="#8B7EC8"/>
    <circle cx="0" cy="-100" r="3.5" fill="#8B7EC8"/>
    <circle cx="3" cy="-112" r="3" fill="#8B7EC8"/>
  </g>

  <!-- Bottom-right small leaves -->
  <g opacity="0.05" transform="translate(500, 780) rotate(-25)">
    <path d="M0,0 Q-20,25 -10,50 Q0,75 -15,100" fill="none" stroke="#8B7EC8" stroke-width="1.5"/>
    <ellipse cx="-12" cy="20" rx="14" ry="8" fill="#8B7EC8" transform="rotate(-40, -12, 20)"/>
    <ellipse cx="-6" cy="48" rx="16" ry="9" fill="#8B7EC8" transform="rotate(35, -6, 48)"/>
    <ellipse cx="-12" cy="78" rx="13" ry="7" fill="#8B7EC8" transform="rotate(-30, -12, 78)"/>
  </g>

  <!-- Soft rose outlines -->
  <g opacity="0.04" transform="translate(300, 120)">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#D4627A" stroke-width="1"/>
    <path d="M-8,-4 Q0,-12 8,-4 Q12,4 4,8 Q0,12 -4,8 Q-12,4 -8,-4" fill="none" stroke="#D4627A" stroke-width="0.8"/>
  </g>
  <g opacity="0.04" transform="translate(150, 700)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#D4627A" stroke-width="1"/>
    <path d="M-9,-5 Q0,-14 9,-5 Q14,5 5,9 Q0,14 -5,9 Q-14,5 -9,-5" fill="none" stroke="#D4627A" stroke-width="0.8"/>
  </g>
  <g opacity="0.03" transform="translate(400, 400)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#8B7EC8" stroke-width="1"/>
    <path d="M-6,-3 Q0,-10 6,-3 Q10,3 3,7 Q0,10 -3,7 Q-10,3 -6,-3" fill="none" stroke="#8B7EC8" stroke-width="0.8"/>
  </g>
</svg>